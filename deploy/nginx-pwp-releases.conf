# Nginx snippet for Climeto PWP electron-updater feed.
# Place inside your existing api.climeto.in server {} block,
# or use deploy/vps-setup.sh for a standalone site file.

location /desktop/pwp/releases/ {
    alias /var/www/climeto/desktop/pwp/releases/;
    autoindex off;

    location = /desktop/pwp/releases/latest.yml {
        alias /var/www/climeto/desktop/pwp/releases/latest.yml;
        default_type text/yaml;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    types {
        application/octet-stream exe blockmap;
    }
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*";
}
